[project]
name = "reflecto"
version = "0.1.0"
description = "AI-powered XRR Analysis Library"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "torch",
    "genx3",
    "matplotlib",
    "tqdm>=4.67.1",
    "bumps>=1.0.3",
    "pandas>=2.3.3",
]

[tool.setuptools.package-data]
reflecto = ["assets/*.pt", "assets/*.json"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

# violations present when ruff became mandatory in CI; remove entries as they are fixed
[tool.ruff.lint.extend-per-file-ignores]
"main.py" = ["F541", "RUF059"]
"src/reflecto/core.py" = ["F401", "RUF013"]
"src/reflecto/engines/model.py" = ["PLR0402"]
"src/reflecto/simulate/profile.py" = ["F401", "PLR1730"]
"src/reflecto/simulate/simulate.py" = ["SIM118", "TRY004", "TRY201"]
"src/reflecto/utils/materials.py" = ["F401", "RUF013"]
"src/reflecto/visualize.py" = ["C408", "RUF059"]
"test_data/In2O3_Ar_30nm/convert_sld_graph.py" = ["BLE001"]
"test_data/In2O3_Ar_30nm/fitting.py" = ["BLE001", "F401", "RUF010"]
